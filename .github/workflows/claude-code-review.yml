name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Needed to post review comments
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9 # v1.0.251
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Without --comment the plugin stops after the review and posts nothing
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # Pinned: the action's default model changes with its version
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"

      # Full output stays hidden (public repo); list only which tool calls were denied
      - name: Report denied tool calls
        continue-on-error: true # Reporting only; never fail the review over it
        if: always() && steps.claude-review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        # Bash denials show the first two words of each part of a compound command
        # (split on ; && || |, at most 4 parts), so "cd /tmp; gh pr diff" reads
        # "cd /tmp → gh pr". Lines after a heredoc start are dropped, and
        # VAR=value words are masked.
        run: |
          denials=$(jq -r '
            def words2: split(" ") | map(select(. != "")) as $w
              | ($w | map(test("^[A-Za-z_][A-Za-z0-9_]*=")) | index(false) // ($w | length)) as $n
              | (if $n > 0 then ["<env>"] else [] end)
                + ($w[$n:$n + 2] | map(if test("=") then "<env>" else . end))
              | join(" ");
            .[] | select(.type == "result") | .permission_denials[]? |
            if .tool_name == "Bash" then
              "Bash: " + ((.tool_input.command // "") | split("\n")
                | (map(test("<<")) | index(true)) as $h | (if $h == null then . else .[0:$h + 1] end)
                | join("; ") | [splits("\\s*(?:;|&&|\\|\\||\\|)\\s*")] | map(select(. != "")) | .[0:4]
                | map(words2) | join(" → "))
            else .tool_name end
          ' "$EXECUTION_FILE" | sort | uniq -c | sort -rn)
          { echo "### Denied tool calls"; echo '```'; echo "${denials:-none}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "${denials:-No denied tool calls}"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

