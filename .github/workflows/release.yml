name: Release Platform

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

concurrency:
  group: release-platform
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Ensure tag commit is on main
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "$TAG_REF")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Tag does not point to a commit on main"
            exit 1
          fi

  test:
    name: Test ${{ matrix.project }}
    needs: verify-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        project: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  installer:
    name: Build installer binaries
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.mod

      - name: Build linux amd64 + arm64
        env:
          TAG: ${{ github.ref_name }}
        run: make -C installer build VERSION="$TAG"

      - name: Write SHA256SUMS
        working-directory: installer/dist
        run: sha256sum achilles-installer-linux-amd64 achilles-installer-linux-arm64 > SHA256SUMS

      - name: Upload installer artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-binaries
          path: installer/dist/
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: [test, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download installer binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-binaries
          path: installer-dist/

      - name: Extract changelog for this version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"

          # Extract the section between ## [VERSION] and the next ## heading.
          # The second rule is load-bearing: `## Agent [0.6.0]` does not match
          # /^## \[/, so without it the notes bleed into the agent changelog.
          # Mirrors the extraction in release-agent.yml.
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
            }
            found && /^## / { exit }
            found { print }
          ' docs/CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            NOTES="Release ${VERSION}. See [CHANGELOG.md](docs/CHANGELOG.md) for details."
          fi

          echo "$NOTES" > /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "ProjectAchilles $TAG_NAME" \
            --notes-file /tmp/release-notes.md \
            --latest \
            installer-dist/achilles-installer-linux-amd64 \
            installer-dist/achilles-installer-linux-arm64 \
            installer-dist/SHA256SUMS
