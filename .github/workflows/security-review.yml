name: Security Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "backend/src/**"
      - "frontend/src/**"
      - "agent/**/*.go"
      - "backend/package*.json"
      - "frontend/package*.json"
      - ".env*"
      - "Dockerfile*"
      - "docker-compose*"
      - ".github/workflows/**"

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/javascript --config p/typescript --config p/nodejs \
            --config p/react --config p/express \
            --config p/owasp-top-ten --config p/security-audit \
            --config p/secrets --config p/golang \
            --config p/dockerfile --config p/github-actions \
            --config .semgrep/rules/ \
            --json --output semgrep-results.json \
            backend/src frontend/src agent/ .github/ \
            || true

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: semgrep-results
          path: semgrep-results.json

      - name: Post findings summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let body = '## Semgrep SAST Results\n\n';

            try {
              const raw = fs.readFileSync('semgrep-results.json', 'utf8');
              const data = JSON.parse(raw);
              const results = data.results || [];

              if (results.length === 0) {
                body += '**No security findings.** All checks passed.\n';
              } else {
                body += `**${results.length} finding(s) detected:**\n\n`;
                body += '| Severity | Rule | File | Line |\n';
                body += '|----------|------|------|------|\n';
                for (const r of results.slice(0, 25)) {
                  const sev = (r.extra?.severity || 'unknown').toUpperCase();
                  const rule = r.check_id?.split('.').pop() || r.check_id;
                  const file = r.path;
                  const line = r.start?.line || '?';
                  body += `| ${sev} | ${rule} | \`${file}\` | ${line} |\n`;
                }
                if (results.length > 25) {
                  body += `\n_...and ${results.length - 25} more. See full SARIF artifact._\n`;
                }
              }
            } catch (e) {
              body += `Scan completed but results could not be parsed: ${e.message}\n`;
              body += 'Download the SARIF artifact for full results.\n';
            }

            // Find and update existing comment, or create new one
            const marker = '<!-- semgrep-results -->';
            body = marker + '\n' + body;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  claude-security-review:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Claude Security Review
        id: claude-security-review
        uses: anthropics/claude-code-action@970cf56ff574f7f75cfb3b2394c8b723c3410247 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            The PR branch is already checked out. Use `gh pr diff` to see the changes.

            Review the changes in this PR for security vulnerabilities. Focus on:

            1. **Command Injection**: execFile/spawn calls with user input, shell metacharacters
            2. **Path Traversal**: path.join/path.resolve with user-controlled segments without path.basename sanitization
            3. **Authentication Bypass**: Missing requireClerkAuth middleware on new route files, timing oracles, token enumeration
            4. **Cryptographic Issues**: Weak KDF, AES-256-GCM IV reuse, missing auth tag verification, hardcoded secrets
            5. **Input Validation**: Unsanitized user input in queries, commands, file paths
            6. **XSS**: dangerouslySetInnerHTML, unsanitized rendering
            7. **SSRF**: URL handling without validation (git URLs, Elasticsearch URLs)
            8. **File Upload**: Missing MIME validation, oversized uploads without limits
            9. **Information Disclosure**: Verbose errors with stack traces in production, credential leaks in responses
            10. **Fail-Open Defaults**: process.env fallbacks with insecure literal defaults for SECRET/KEY/TOKEN/PASSWORD variables
            11. **SQL Injection**: String concatenation in SQLite queries instead of parameterized statements
            12. **Argument Injection**: User-controlled values passed to execFile/spawn without regex validation

            For each finding, include:
            - Severity (Critical/High/Medium/Low)
            - OWASP category
            - File and line number
            - Description and impact
            - Recommended fix

            How to report (only GitHub comments are visible; plain message text is discarded):
            - Post each finding as an inline comment on the relevant line using
              `mcp__github_inline_comment__create_inline_comment` with `confirmed: true`.
              One comment per unique issue.
            - Then post one top-level summary with `gh pr comment`, starting with the line
              `<!-- claude-security-review -->` followed by a `## Claude Security Review` heading
              and a severity table of the findings.
            - If no security issues are found: check `gh pr view --comments` for an existing
              comment containing `<!-- claude-security-review -->`. If none exists, post one
              confirming the PR passes security review. If one exists, post nothing.
          # Pinned: the action's default model changes with its version
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # Full output stays hidden (public repo); list only which tool calls were denied
      - name: Report denied tool calls
        continue-on-error: true # Reporting only; never fail the review over it
        if: always() && steps.claude-security-review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude-security-review.outputs.execution_file }}
        # Bash denials show only the first two words of the command; VAR=value words are masked
        run: |
          denials=$(jq -r '
            .[] | select(.type == "result") | .permission_denials[]? |
            if .tool_name == "Bash" then
              "Bash: " + ((.tool_input.command // "") | split(" ") | map(select(. != "")) | .[0:2]
                | map(if test("=") then "<env>" else . end) | join(" "))
            else .tool_name end
          ' "$EXECUTION_FILE" | sort | uniq -c | sort -rn)
          { echo "### Denied tool calls"; echo '```'; echo "${denials:-none}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "${denials:-No denied tool calls}"
